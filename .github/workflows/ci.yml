name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # skills-ref is the Agent Skills spec's reference validator. Its maintainers
      # don't publish it to PyPI (the "skills-ref" there is an unofficial upload),
      # so it installs from a pinned commit, with deps pinned to upstream's uv.lock.
      - run: >-
          pip install
          "skills-ref @ git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          click==8.3.1 strictyaml==1.7.3 python-dateutil==2.9.0.post0 six==1.17.0
      - run: |
          for skill in skills/*/; do skills-ref validate "$skill" || failed=1; done
          exit "${failed:-0}"
